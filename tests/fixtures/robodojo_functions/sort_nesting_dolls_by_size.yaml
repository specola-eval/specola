    \ + robot_1[link_wrench_link7_1]^2 + robot_1[link_wrench_link7_2]^2) - fhold >=\
    \ 0\n    and vmatch - sqrt((robot_1[body_lin_vel_w_link7_0] - rigid_*[root_lin_vel_w_0])^2\
